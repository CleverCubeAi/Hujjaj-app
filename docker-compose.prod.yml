version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hujjaj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hujjaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hujjaj}
      POSTGRES_DB: ${POSTGRES_DB:-hujjaj}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hujjaj-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hujjaj} -d ${POSTGRES_DB:-hujjaj}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hujjaj-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgres://hujjaj:hujjaj@postgres:5432/hujjaj}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://hujjaj.app}
      - ALLOW_PUBLIC_REGISTER=${ALLOW_PUBLIC_REGISTER:-false}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@hujjaj.app}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Admin123!}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Super Admin}
      - SEED_DEMO=${SEED_DEMO:-false}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-Demo123!}
      - PUBLIC_URL=${PUBLIC_URL:-https://hujjaj.app}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hujjaj-network
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: hujjaj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hujjaj-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: hujjaj-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hujjaj-network

  certbot:
    image: certbot/certbot
    container_name: hujjaj-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  hujjaj-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-uploads:
    driver: local
  certbot-www:
    driver: local
